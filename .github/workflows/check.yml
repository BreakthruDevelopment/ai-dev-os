name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Claude subagents match roles/
        run: python3 scripts/sync-claude-agents.py --check
      - name: Issue scripts and the Mac runner parse issues the same way
        run: |
          # Every --self-test must print its result line, not merely exit 0. A self-test that exits 0
          # having printed NOTHING is invisible to `test $? -eq 0`: round 11 reverted one word
          # (`BaseException` -> `Exception`) and an import-time SystemExit in another script made a
          # whole self-test vanish, with CI green. So the line is required, whatever causes its
          # absence -- the class, not the instance. Applied to all four scripts, since singling one
          # out was the first version's mistake.
          #
          # `|| rc=$?` rather than `; rc=$?`: Actions runs this under `bash -e`, so a bare assignment
          # that fails kills the script AT the assignment -- rc, the printf and the test never run,
          # and a genuine failure shows a red step with an empty log. The status is the command
          # substitution's either way, which `||` preserves.
          self_test() {
            rc=0
            out=$(python3 "scripts/$1.py" --self-test) || rc=$?
            printf '%s\n' "$out"
            if [ "$rc" -ne 0 ]; then
              echo "::error::scripts/$1.py --self-test failed"
              exit "$rc"
            fi
            printf '%s' "$out" | grep -q 'self-test ok' || {
              echo "::error::scripts/$1.py --self-test exited 0 without its result line; it did not run to the end"
              exit 1
            }
          }
          self_test issuelib
          self_test open-issues
          self_test release-labels
          bash -n scripts/run-harness.sh
          shellcheck scripts/run-harness.sh
      - name: Foundation-path prose matches WAVE1_PATHS
        run: |
          # Every --self-test must print its result line, not merely exit 0. A self-test that exits 0
          # having printed NOTHING is invisible to `test $? -eq 0`: round 11 reverted one word
          # (`BaseException` -> `Exception`) and an import-time SystemExit in another script made a
          # whole self-test vanish, with CI green. So the line is required, whatever causes its
          # absence -- the class, not the instance. Applied to all four scripts, since singling one
          # out was the first version's mistake.
          #
          # `|| rc=$?` rather than `; rc=$?`: Actions runs this under `bash -e`, so a bare assignment
          # that fails kills the script AT the assignment -- rc, the printf and the test never run,
          # and a genuine failure shows a red step with an empty log. The status is the command
          # substitution's either way, which `||` preserves.
          self_test() {
            rc=0
            out=$(python3 "scripts/$1.py" --self-test) || rc=$?
            printf '%s\n' "$out"
            if [ "$rc" -ne 0 ]; then
              echo "::error::scripts/$1.py --self-test failed"
              exit "$rc"
            fi
            printf '%s' "$out" | grep -q 'self-test ok' || {
              echo "::error::scripts/$1.py --self-test exited 0 without its result line; it did not run to the end"
              exit 1
            }
          }
          self_test sync-wave1-docs
          python3 scripts/sync-wave1-docs.py --check
      - name: Repo creation marks are valid
        run: python3 scripts/create-app-repos.py --check
      - name: Catalog is valid
        run: |
          python3 - <<'PY'
          import os
          import yaml
          apps = yaml.safe_load(open("catalog.yaml"))["apps"]
          assert len(apps) == 33, f"expected 33 apps, got {len(apps)}"
          clouds = ["aws", "azure", "gcp", "oci"]
          for i, a in enumerate(apps, start=1):
              assert a["n"] == i, f"app {i} out of order"
              assert a["repo"].startswith(f"{i:02d}-"), a["repo"]
              assert a["subdomain"] == f"app{i}.breakthruventures.ai", a["subdomain"]
              # The cloud rotates by app number. An app may opt out of the rotation with rotation_reason,
              # a non-empty string saying why its cloud is fixed -- but its cloud is still validated.
              assert a["live_cloud"] in clouds, f"app {i} cloud {a['live_cloud']!r} is not one of {clouds}"
              why = a.get("rotation_reason")
              if why is None:
                  assert a["live_cloud"] == clouds[(i - 1) % 4], f"app {i} cloud"
              else:
                  assert isinstance(why, str) and why.strip(), f"app {i} rotation_reason must be a non-empty string"
                  print(f"app {i} ({a['repo']}) opts out of the cloud rotation on {a['live_cloud']}: {why}")
              # BreakthruSoftwareFactory statuses (FACTORY.md); done needs its run log
              assert a.get("status") in ("planned", "building", "deployed", "done"), f"app {i} status {a.get('status')!r}"
              if a["status"] == "done":
                  assert os.path.exists(f"runs/{a['repo']}.md"), f"app {i} is done but runs/{a['repo']}.md is missing"
          assert len({a["repo"] for a in apps}) == len(apps), "duplicate repo names"
          print("catalog ok")
          PY
