name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Claude subagents match roles/
        run: python3 scripts/sync-claude-agents.py --check
      - name: Repo creation marks are valid
        run: python3 scripts/create-app-repos.py --check
      - name: Catalog is valid
        run: |
          python3 - <<'PY'
          import yaml
          apps = yaml.safe_load(open("catalog.yaml"))["apps"]
          assert len(apps) == 30, f"expected 30 apps, got {len(apps)}"
          clouds = ["aws", "azure", "gcp", "oci"]
          for i, a in enumerate(apps, start=1):
              assert a["n"] == i, f"app {i} out of order"
              assert a["repo"].startswith(f"{i:02d}-"), a["repo"]
              assert a["subdomain"] == f"app{i}.breakthruventures.ai", a["subdomain"]
              assert a["live_cloud"] == clouds[(i - 1) % 4], f"app {i} cloud"
          assert len({a["repo"] for a in apps}) == 30, "duplicate repo names"
          print("catalog ok")
          PY
