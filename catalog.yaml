# The portfolio apps (32). Source of truth for repo names, subdomains and the cloud each app is live on.
# Cloud rotates by day: AWS, Azure, Google Cloud, Oracle Cloud. Deploys happen by adding the app to apps.yaml in
# 30-apps-infra; listing more clouds there runs it on those too.
#
# status (BreakthruSoftwareFactory, see FACTORY.md "Catalog status values"):
#   planned   in the catalog only
#   building  repo exists, issues or PRs in flight, not in apps.yaml yet
#   deployed  in 30-apps-infra apps.yaml and answering /api/health at its domain; close-out not finished
#   done      meets the definition of done: filled README, live smoke, run log in runs/, this status
# Statuses for apps 1-12 were set on 2026-11-10 from GitHub and live health checks (runs/retro-01-12.md).
domain: breakthruventures.ai
github_org: BreakthruDevelopment
repo_topic: 30-apps-30-days
template_repo: 30-apps-template

apps:
